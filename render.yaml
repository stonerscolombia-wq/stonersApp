services:
  - type: web
    name: stoners-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://stonerscolombia-wq.github.io
      - key: FRONTEND_URL
        value: https://stonerscolombia-wq.github.io/stonersApp/
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
